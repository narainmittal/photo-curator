[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-curator"
version = "0.1.0"
description = "Private, repeatable photo review and display album preparation"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
photo-curator = "photo_album.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_album = ["templates/*.html"]
